name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR이 문서(*.md, docs/, 개발산출물/)만 바꿨으면 아래 테스트를 건너뜁니다.
  # 워크플로 paths-ignore를 쓰면 필수 체크가 '대기'로 남아 머지가 막히므로 작업 단위로 거릅니다
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git -c core.quotePath=false diff --name-only "$BASE"...HEAD)
          echo "$files"
          code=$(echo "$files" | grep -vE '(\.md$|^docs/|^개발산출물/)' || true)
          if [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; echo "문서만 변경 — 테스트 건너뜀"; fi

  test:
    name: Test (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20은 2026-04 지원 종료. Dockerfile(node:22)과 다음 LTS(24)로 확인합니다
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # 외부 의존성이 없으므로 install 단계 없이 바로 테스트합니다
      - run: npm test

  # Kotlin 서버(K0-1 이후). gradlew가 생기면 CI 수정 없이 ./gradlew test가 돌기 시작합니다
  kotlin:
    name: Kotlin test (JDK 21)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: detect
        run: |
          if [ -f gradlew ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "gradlew 없음 — Kotlin 테스트 건너뜀"; fi
      - if: steps.detect.outputs.found == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.detect.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@v5
      - if: steps.detect.outputs.found == 'true'
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [test, kotlin]
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t guitar-chord-lab:ci .
      - name: Run container
        run: docker run -d --name app -p 3000:3000 guitar-chord-lab:ci
      - name: Health check
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo; echo "healthy"; exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
      - name: Index page responds
        run: curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3000/
      - name: Cleanup
        if: always()
        run: docker rm -f app || true

  # ruleset 필수 체크는 이 작업 하나만 건다. 테스트를 건너뛴 문서 PR은 통과, 하나라도 실패·취소면 실패
  ci-ok:
    name: CI ok
    runs-on: ubuntu-latest
    needs: [changes, test, kotlin, docker]
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, kotlin, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Pages는 모든 파일에 max-age=600을 걸어서, 노션 임베드·아이패드 웹뷰가 새 HTML에 옛 CSS·JS를 섞어 씀.
      # 배포마다 로컬 CSS·JS 주소에 커밋 버전을 붙여 HTML이 바뀌면 CSS·JS도 새로 받게 함
      - name: Version asset URLs
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"([a-z0-9/_-]+\.(css|js))\"#\1=\"\2?v=$v\"#g" public/*.html
          grep -c "?v=$v" public/*.html
      # 화면은 브라우저에서 모든 계산을 하므로 public/ 만 올립니다 (/api 는 Pages 에서 제공되지 않음)
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
