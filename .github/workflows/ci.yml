name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # 외부 의존성이 없으므로 install 단계 없이 바로 테스트합니다
      - run: npm test

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t guitar-chord-lab:ci .
      - name: Run container
        run: docker run -d --name app -p 3000:3000 guitar-chord-lab:ci
      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo; echo "healthy"; exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
      - name: Index page responds
        run: curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3000/
      - name: Cleanup
        if: always()
        run: docker rm -f app || true
