name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # 외부 의존성이 없으므로 install 단계 없이 바로 테스트합니다
      - run: npm test

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t guitar-chord-lab:ci .
      - name: Run container
        run: docker run -d --name app -p 3000:3000 guitar-chord-lab:ci
      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo; echo "healthy"; exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
      - name: Index page responds
        run: curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3000/
      - name: Cleanup
        if: always()
        run: docker rm -f app || true

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Pages는 모든 파일에 max-age=600을 걸어서, 노션 임베드·아이패드 웹뷰가 새 HTML에 옛 CSS·JS를 섞어 씀.
      # 배포마다 로컬 CSS·JS 주소에 커밋 버전을 붙여 HTML이 바뀌면 CSS·JS도 새로 받게 함
      - name: Version asset URLs
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"([a-z0-9/_-]+\.(css|js))\"#\1=\"\2?v=$v\"#g" public/*.html
          grep -c "?v=$v" public/*.html
      # 화면은 브라우저에서 모든 계산을 하므로 public/ 만 올립니다 (/api 는 Pages 에서 제공되지 않음)
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
