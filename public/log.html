<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js https://www.youtube.com/iframe_api https://www.youtube.com/s/player/; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com; media-src 'self' blob: https://vefrfhafmiiivpgjhqiu.supabase.co; connect-src 'self' https://vefrfhafmiiivpgjhqiu.supabase.co https://script.google.com https://script.googleusercontent.com https://api.github.com; frame-src https://www.youtube.com; object-src 'none'; base-uri 'none'; form-action 'self'; worker-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연습 기록 · ULeveLP</title>
<meta name="description" content="최근 12주 연습 달력과 곡별 기록·녹음을 한눈에 확인해요.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ULeveLP">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="site.css">
<script src="theme.js"></script>
</head>
<body>
<div class="page log-page">
  <nav class="site-nav" aria-label="사이트">
    <a href="./">⌂ HOME</a>
    <span class="links"><a href="log.html" aria-current="page">LOG</a><a href="notes.html">NOTES</a><a href="settings.html">SETTING</a><a href="settings.html#account" id="navAuth">LOGIN</a></span>
  </nav>

  <header id="logHeader">
    <h1 class="page-title">Log</h1>
    <p class="page-sub">최근 12주 연습 달력과 곡별 기록·녹음을 한눈에 확인해요.</p>
    <nav class="tabs" id="logTabs" role="tablist" aria-label="기록 보기">
      <button type="button" class="tab" role="tab" id="tab-log" aria-selected="true">기록</button>
      <button type="button" class="tab" role="tab" id="tab-songs" aria-selected="false">곡</button>
    </nav>
  </header>

  <p class="msg" id="logMsg" role="status"></p>

  <div class="panel" id="logGuest" hidden>
    <p>Google 계정으로 로그인하면 연습 달력과 녹음 기록을 볼 수 있어요.</p>
    <div class="row"><a class="cta" href="settings.html#account">로그인하러 가기</a></div>
  </div>

  <!-- 기록 탭 패널 -->
  <section id="pane-log" role="tabpanel" aria-labelledby="tab-log">
    <!-- 1. 주간·월간 요약 -->
    <div class="log-summary">
      <div class="summary-card">
        <span class="summary-title">이번 주 총 연습</span>
        <span class="summary-val" id="sumWeek">0분</span>
      </div>
      <div class="summary-card">
        <span class="summary-title">이번 달 총 연습</span>
        <span class="summary-val" id="sumMonth">0분</span>
      </div>
    </div>

    <!-- 2. 12주 연습 달력 -->
    <div class="panel">
      <div class="head-row">
        <h2 class="h3">최근 12주 연습 달력</h2>
        <span class="meta" id="calRange"></span>
      </div>
      <div class="cal-grid" id="calGrid" role="grid" aria-label="최근 12주 연습 달력"></div>
      <div class="cal-legend" aria-hidden="true">
        <span>적음</span>
        <i class="lv0"></i>
        <i class="lv1"></i>
        <i class="lv2"></i>
        <i class="lv3"></i>
        <i class="lv4"></i>
        <span>많음</span>
      </div>
    </div>

    <!-- 3. 선택한 날짜 세션 목록 -->
    <div id="daySection">
      <h2 id="dayTitle">연습 기록</h2>
      <div class="log-sessions" id="daySessions"></div>
    </div>
  </section>

  <!-- 곡 탭 패널 (FR-LIB-1) -->
  <section id="pane-songs" role="tabpanel" aria-labelledby="tab-songs" hidden>
    <div class="seg-pill" id="songFilters" role="group" aria-label="곡 상태 필터">
      <button type="button" data-status="" aria-pressed="true">전체</button><button type="button" data-status="practicing" aria-pressed="false">연습 중</button><button type="button" data-status="paused" aria-pressed="false">보류</button><button type="button" data-status="done" aria-pressed="false">완료</button>
    </div>
    <div class="log-sessions" id="songList"></div>
  </section>

  <!-- 곡 상세 패널 (FR-LIB-2, FR-LIB-3) -->
  <section id="pane-song-detail" hidden>
    <div class="panel">
      <div class="row">
        <button type="button" class="ghost mini" id="btnBackSongs">← 곡 목록</button>
      </div>
      <div>
        <h2 class="h3" id="detailTitle"></h2>
        <span class="meta" id="detailArtist"></span>
      </div>
      <div class="meta" id="detailMeta"></div>
      <div class="row">
        <a class="cta" id="detailResume" href="#">▶ 이어서 연습</a>
        <select id="detailStatus" aria-label="곡 상태">
          <option value="practicing">연습 중</option>
          <option value="paused">보류</option>
          <option value="done">완료</option>
        </select>
        <button type="button" class="ghost" id="btnDeleteSong">곡 삭제</button>
      </div>
      <div class="field">
        <label class="lab" for="detailMemo">곡 메모</label>
        <textarea id="detailMemo" class="inp" rows="2" maxlength="2000" placeholder="곡 메모"></textarea>
        <div class="row"><button type="button" class="ghost" id="btnSaveSongMemo">저장</button></div>
      </div>
    </div>

    <!-- 연습 시간 막대 타임라인 (FR-LIB-2) -->
    <div class="panel">
      <div class="head-row">
        <h3 class="h3">연습 세션 타임라인</h3>
      </div>
      <div id="detailTimeline"></div>
    </div>

    <!-- 녹음 목록 및 A/B 비교 듣기 (FR-LIB-3) -->
    <div class="panel">
      <div class="head-row">
        <h3 class="h3">녹음 테이크 목록</h3>
      </div>
      <div id="detailTakes"></div>

      <!-- A/B 비교 패널 -->
      <div class="panel" id="abPanel" hidden>
        <div class="head-row">
          <h4 class="h3">녹음 A/B 비교 듣기</h4>
          <span class="meta">과거 녹음과 최근 녹음 교차 비교</span>
        </div>
        <div class="ab-slots">
          <div class="ab-slot" id="abSlotA">
            <span class="meta" id="abLabelA">A (과거 녹음)</span>
            <button type="button" class="ghost mini" id="abPlayA">▶ 재생</button>
            <audio id="abAudioA" controls preload="none"></audio>
          </div>
          <div class="ab-slot" id="abSlotB">
            <span class="meta" id="abLabelB">B (최근 녹음)</span>
            <button type="button" class="ghost mini" id="abPlayB">▶ 재생</button>
            <audio id="abAudioB" controls preload="none"></audio>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="site.js"></script>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="log.js"></script>
</body>
</html>
