<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js https://www.youtube.com/iframe_api https://www.youtube.com/s/player/; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com; media-src 'self' blob:; connect-src 'self' https://vefrfhafmiiivpgjhqiu.supabase.co http://127.0.0.1:54321 https://script.google.com https://script.googleusercontent.com https://api.github.com; frame-src https://www.youtube.com; object-src 'none'; base-uri 'none'; form-action 'self'; worker-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학습 노트 · ULeveLP</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="site.css">
<script src="theme.js"></script>
</head>
<body>
<div class="page">
  <nav class="site-nav" aria-label="사이트">
    <a href="./">⌂ HOME</a>
    <span class="links"><a href="notes.html" aria-current="page">NOTES</a><a href="settings.html">SETTING</a><a href="settings.html#account" id="navAuth">LOGIN</a></span>
  </nav>

  <div>
    <h1 class="page-title">Notes</h1>
    <p class="page-sub">유튜브 링크와 태그를 넣으면 Gemini가 영상을 분석해서 노션 <b>학습 영상 노트</b>에 정리해요. 보통 1~3분 걸려요. <a id="notionLink" target="_blank" rel="noopener" hidden>노션에서 보기 ↗</a></p>
  </div>

  <form class="note-form" id="form">
    <label class="field">
      <span class="lab">유튜브 링크</span>
      <input class="inp" id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" required>
      <span class="preview" id="preview"><img alt=""><span class="hint">영상을 확인했어요</span></span>
    </label>
    <div class="field">
      <span class="lab">태그</span>
      <div class="tags" id="tags" role="group" aria-label="태그"></div>
      <span class="hint">고른 태그에 맞춰 정리 항목이 달라져요. 여러 개 골라도 됩니다.</span>
    </div>
    <label class="field">
      <span class="lab">메모 <span class="hint">(선택)</span></span>
      <textarea class="inp" id="memo" placeholder="예: 3:20부터 나오는 보이싱 위주로"></textarea>
    </label>
    <div class="row">
      <button class="cta" id="submit" type="submit">분석 요청</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <h2>최근 요청</h2>
  <ul class="runs" id="runs"><li class="empty">SETTING에서 GitHub 토큰을 넣으면 기록이 보여요.</li></ul>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="site.js"></script>
<script src="auth.js"></script>
<script src="notes.js"></script>
</body>
</html>
