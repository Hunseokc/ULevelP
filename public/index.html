<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ULeveLP</title>
<meta name="description" content="코드 연습, 유튜브 구간 연습, 학습 영상 노트를 한곳에서">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ULeveLP">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="site.css">
<script>try { var t = localStorage.getItem('gv-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body class="home">
<div class="home-wrap">
  <nav class="site-nav" aria-label="사이트">
    <a href="./" aria-current="page">⌂ HOME</a>
    <span class="links"><a href="notes.html">NOTES</a><a href="settings.html">SETTING</a></span>
  </nav>

  <h1 class="wordmark">ULeveLP</h1>
  <hr class="home-rule">
  <p class="tagline">DIVE INTO SOUND</p>

  <!-- 링크 하나로 시작: 바로 연습하거나 학습 노트로 정리 -->
  <form class="go" id="go">
    <input class="inp" id="goUrl" type="url" inputmode="url" autocomplete="off" placeholder="유튜브 링크를 붙여넣으세요" aria-label="유튜브 링크">
    <div class="go-pick" id="goPick" hidden>
      <img id="goThumb" alt="">
      <div class="acts">
        <a class="cta" id="goPlay" href="practice.html">▶ 바로 연습</a>
        <a class="sec" id="goNote" href="notes.html">노트 만들기</a>
      </div>
    </div>
    <p class="msg" id="goMsg" role="status"></p>
  </form>

  <div class="frames">
    <section class="frame" aria-labelledby="fChords">
      <div class="frame-head"><h2 id="fChords">CHORDS</h2><span>코드 연습</span></div>
      <ul class="frame-list" id="modes"></ul>
      <a class="sec more" href="chords.html">코드 연습실 열기</a>
    </section>
    <section class="frame" aria-labelledby="fPlayer">
      <div class="frame-head"><h2 id="fPlayer">PLAYER</h2><span>플레이어 연습</span></div>
      <ul class="frame-list" id="songs"></ul>
      <a class="sec more" href="practice.html">플레이어 열기</a>
    </section>
  </div>

  <a class="notion-big" id="notionBig" href="settings.html#links">NOTION</a>
  <div class="notion-links" id="notionLinks" hidden>
    <a id="nlPractice" target="_blank" rel="noopener" hidden>악기 연습 ↗</a>
    <a id="nlNotes" target="_blank" rel="noopener" hidden>학습 영상 노트 ↗</a>
  </div>

  <footer class="home-foot"><span>DAILY DIARY</span><span id="copy">©2026</span></footer>
</div>

<script src="site.js"></script>
<script>
'use strict';
(function () {
  const $ = (id) => document.getElementById(id);
  const { raw, videoIdFrom, thumb, esc, notion } = UL;

  // ---------- 링크 붙여넣기 ----------
  function pick() {
    const id = videoIdFrom($('goUrl').value);
    $('goPick').hidden = !id;
    $('goMsg').textContent = $('goUrl').value.trim() && !id ? '유튜브 영상 링크가 아니에요' : '';
    $('goMsg').classList.toggle('err', !!$('goMsg').textContent);
    if (!id) return;
    $('goThumb').src = thumb(id);
    $('goPlay').href = 'practice.html?v=' + id;
    $('goNote').href = 'notes.html?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id);
  }
  $('goUrl').addEventListener('input', pick);
  $('go').addEventListener('submit', (e) => { e.preventDefault(); pick(); if (!$('goPick').hidden) location.href = $('goPlay').href; });

  // ---------- 코드 연습: 탭 목록, 마지막으로 쓴 탭 표시 ----------
  const MODES = [['scale', '스케일 연습'], ['tone', '코드톤 지도'], ['matrix', '보이싱 매트릭스'], ['circle', '탑노트 5도권'], ['reint', '우기기'], ['tf', '2-5-1 탐색']];
  const last = raw.get('gv-tab');
  $('modes').innerHTML = MODES.map(([id, name], i) =>
    '<li' + (id === last ? ' class="cur"' : '') + '><a href="chords.html#' + id + '"><span class="t">' + (i + 1) + ' · ' + name + '</span>' +
    '<span class="m">' + (id === last ? '이어서' : '') + '</span></a></li>').join('');

  // ---------- 플레이어: 노션의 연습 곡 ----------
  function songsNote(t, href) {
    $('songs').innerHTML = '<li class="note">' + (href ? '<a href="' + href + '">' + esc(t) + '</a>' : esc(t)) + '</li>';
  }
  async function loadSongs() {
    if (!notion.ok()) return songsNote('SETTING에서 노션을 연결하면 연습 곡이 여기 보여요', 'settings.html#notion');
    songsNote('불러오는 중…');
    try {
      const songs = ((await notion.call('/songs')).songs || []).slice(0, 5);
      if (!songs.length) return songsNote('아직 곡이 없어요. 위에 링크를 붙여넣어 시작하세요');
      $('songs').innerHTML = songs.map((s) => {
        const meta = [s.status, s.rate ? s.rate + '×' : '', s.lastDate ? s.lastDate.slice(5).replace('-', '/') : ''].filter(Boolean).join(' · ');
        return '<li><a href="practice.html?v=' + encodeURIComponent(s.videoId) + '"><span class="t">' + esc(s.title) + '</span><span class="m">' + esc(meta) + '</span></a></li>';
      }).join('');
    } catch (e) {
      songsNote(e.message);
    }
  }
  loadSongs();

  // ---------- 노션 바로가기 ----------
  const links = [['nlPractice', raw.get('ul-notion-practice')], ['nlNotes', raw.get('ul-notion-notes')]];
  links.forEach(([id, href]) => { $(id).hidden = !href; if (href) $(id).href = href; });
  $('notionLinks').hidden = !links.some(([, href]) => href);
  const main = links.find(([, href]) => href);
  if (main) { $('notionBig').href = main[1]; $('notionBig').target = '_blank'; $('notionBig').rel = 'noopener'; }

  $('copy').textContent = '©' + new Date().getFullYear();
})();
</script>
</body>
</html>
